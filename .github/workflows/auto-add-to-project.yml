name: Auto Add Issues & PRs to Project

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

jobs:
  add-to-project:
    name: Auto Add to GenValue Project
    runs-on: ubuntu-latest
    steps:
      - name: Add item to Project 2
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/genvaluelabs-a11y/projects/2
          github-token: ${{ secrets.PROJECT_PAT || secrets.GITHUB_TOKEN }}
        continue-on-error: true
